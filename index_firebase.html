<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBO 모의주식 거래소</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--surface3:#1f2d45;--border:#1e3a5f;--accent:#00d4ff;--green:#00e676;--red:#ff3d57;--gold:#ffd700;--text:#e8f0fe;--text2:#7a9cc0;--text3:#3d5a7a;--fd:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;--fb:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;--fm:'JetBrains Mono','SF Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}

/* 모달 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:16px;padding:40px;width:360px;position:relative;}
.modal-close{position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--text2);font-size:20px;cursor:pointer;}
.modal-close:hover{color:var(--text);}
.modal-logo{font-family:var(--fd);font-size:24px;color:var(--accent);text-align:center;margin-bottom:6px;}
.modal-logo span{color:var(--gold);}
.modal-sub{text-align:center;color:var(--text3);font-size:12px;margin-bottom:24px;}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px;}
.auth-tab{flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-family:var(--fb);font-size:13px;cursor:pointer;transition:all .15s;}
.auth-tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.auth-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--fb);font-size:14px;outline:none;margin-bottom:10px;transition:border-color .2s;}
.auth-input:focus{border-color:var(--accent);}
.auth-input::placeholder{color:var(--text3);}
.auth-btn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:8px;color:#000;font-family:var(--fd);font-size:16px;cursor:pointer;letter-spacing:1px;margin-top:4px;}
.auth-btn:hover{background:#33ddff;}
.auth-err{color:var(--red);font-size:12px;text-align:center;margin-top:8px;min-height:18px;}

/* 헤더 */
header{position:sticky;top:0;z-index:100;background:rgba(10,14,26,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;}
.header-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:24px;height:64px;}
.logo{font-family:var(--fd);font-size:20px;font-weight:700;color:var(--text);letter-spacing:-0.5px;white-space:nowrap;}.logo span{color:var(--accent);font-weight:300;}

.header-stats{display:flex;gap:20px;flex:1;}
.hstat{display:flex;flex-direction:column;gap:2px;}
.hstat-label{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;}
.hstat-value{font-family:var(--fm);font-size:14px;font-weight:700;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.user-badge{font-size:13px;color:var(--text2);background:var(--surface2);padding:6px 14px;border-radius:20px;border:1px solid var(--border);}
.user-badge strong{color:var(--accent);}
.header-btn{padding:7px 16px;border-radius:20px;font-size:13px;cursor:pointer;font-family:var(--fb);transition:all .15s;}
.btn-login{background:transparent;border:1px solid var(--accent);color:var(--accent);}
.btn-login:hover{background:var(--accent);color:#000;}
.btn-register{background:var(--accent);border:1px solid var(--accent);color:#000;font-weight:700;}
.btn-register:hover{background:#33ddff;}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-logout:hover{border-color:var(--red);color:var(--red);}
.updated-badge{font-size:11px;color:var(--text3);font-family:var(--fm);background:var(--surface2);padding:4px 10px;border-radius:20px;border:1px solid var(--border);}

/* 탭 */
.tabs{max-width:1600px;margin:20px auto 0;padding:0 24px;display:flex;gap:4px;position:relative;z-index:1;}
.tab-btn{padding:10px 24px;background:var(--surface);border:1px solid var(--border);border-bottom:none;color:var(--text2);font-family:var(--fb);font-size:14px;cursor:pointer;border-radius:8px 8px 0 0;transition:all .2s;font-weight:500;}
.tab-btn:hover{color:var(--text);background:var(--surface2);}
.tab-btn.active{background:var(--surface2);color:var(--accent);border-color:var(--accent);border-bottom-color:var(--surface2);}

/* 메인 */
.main-wrap{max-width:1600px;margin:0 auto;padding:0 24px 40px;position:relative;z-index:1;}
.tab-panel{display:none;}.tab-panel.active{display:block;}

/* 시장 */
.market-layout{display:grid;grid-template-columns:260px 1fr;gap:16px;background:var(--surface2);border:1px solid var(--border);border-top:2px solid var(--accent);border-radius:0 12px 12px 12px;padding:20px;min-height:600px;}
.filter-bar{display:flex;flex-direction:column;gap:12px;}
.filter-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
.filter-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.search-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:var(--fb);font-size:13px;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--accent);}
.search-input::placeholder{color:var(--text3);}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;font-family:var(--fb);}
.chip:hover{border-color:var(--accent);color:var(--accent);}
.chip.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.stat-filter-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;font-family:var(--fb);width:100%;margin-bottom:4px;}
.stat-filter-btn:hover{border-color:var(--accent);color:var(--text);}
.stat-filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.08);}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.stock-list-area{overflow:hidden;display:flex;flex-direction:column;}
.list-header{display:grid;grid-template-columns:1fr 90px 110px 70px 60px;gap:8px;padding:8px 12px;font-size:11px;color:var(--text3);text-transform:uppercase;border-bottom:1px solid var(--border);margin-bottom:8px;}
.stock-list{flex:1;height:520px;overflow-y:auto;padding-right:4px;}
.stock-list::-webkit-scrollbar{width:4px;}
.stock-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.stock-row{display:grid;grid-template-columns:1fr 90px 110px 70px 60px;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:4px;align-items:center;}
.stock-row:hover{background:var(--surface3);border-color:var(--border);}
.stock-row.selected{background:rgba(0,212,255,.08);border-color:var(--accent);}
.stock-name{display:flex;flex-direction:column;gap:2px;}
.stock-player{font-size:14px;font-weight:500;}
.stock-meta{font-size:11px;color:var(--text3);}
.stat-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700;margin-left:4px;}
.stock-price{font-family:var(--fm);font-size:13px;font-weight:700;text-align:right;}
.stock-change{font-family:var(--fm);font-size:12px;text-align:right;}
.pos{color:var(--green);}.neg{color:var(--red);}.zero{color:var(--text2);}
.stat-val{font-family:var(--fm);font-size:12px;color:var(--text2);text-align:right;}
.team-tag{font-size:11px;color:var(--text3);text-align:right;}

/* 상세 패널 */
.detail-panel{position:fixed;right:-500px;top:64px;width:480px;height:calc(100vh - 64px);background:var(--surface);border-left:1px solid var(--border);z-index:200;transition:right .3s ease;overflow-y:auto;padding:24px;}
.detail-panel.open{right:0;}
.detail-close{position:absolute;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
.detail-close:hover{color:var(--text);border-color:var(--accent);}
.detail-player-name{font-family:var(--fd);font-size:26px;margin-bottom:4px;}
.detail-team-pos{color:var(--text2);font-size:13px;margin-bottom:16px;}
.detail-price-big{font-family:var(--fm);font-size:32px;font-weight:700;color:var(--accent);margin-bottom:4px;}
.detail-change-line{font-family:var(--fm);font-size:13px;margin-bottom:4px;}
.detail-change-sub{font-size:11px;color:var(--text3);margin-bottom:20px;}
.chart-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px;}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.chart-title{font-size:12px;color:var(--text2);font-weight:500;}
.chart-period-btns{display:flex;gap:4px;}
.period-btn{padding:3px 10px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;cursor:pointer;font-family:var(--fm);}
.period-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.chart-canvas-wrap{position:relative;height:160px;}
.detail-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.dstat-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;}
.dstat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.dstat-value{font-family:var(--fm);font-size:18px;font-weight:700;}
.trade-panel{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
.trade-title{font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:500;}
.qty-control{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.qty-btn{width:32px;height:32px;background:var(--surface3);border:1px solid var(--border);color:var(--text);border-radius:6px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.qty-btn:hover{border-color:var(--accent);color:var(--accent);}
.qty-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;color:var(--text);font-family:var(--fm);font-size:16px;text-align:center;outline:none;}
.qty-input:focus{border-color:var(--accent);}
.trade-summary{font-family:var(--fm);font-size:13px;color:var(--text2);margin-bottom:12px;text-align:center;}
.trade-summary strong{color:var(--accent);}
.trade-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn-buy,.btn-sell{padding:12px;border:none;border-radius:8px;font-family:var(--fd);font-size:16px;cursor:pointer;transition:all .15s;letter-spacing:1px;}
.btn-buy{background:var(--green);color:#000;}
.btn-buy:hover{background:#00ff88;transform:translateY(-1px);}
.btn-sell{background:var(--red);color:#fff;}
.btn-sell:hover{background:#ff6070;transform:translateY(-1px);}
.login-required-msg{text-align:center;padding:16px;color:var(--text3);font-size:13px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;}
.login-required-msg:hover{border-color:var(--accent);color:var(--accent);}

/* 댓글 */
.comment-section{margin-top:4px;}
.comment-title{font-size:13px;color:var(--text2);font-weight:500;margin-bottom:10px;}
.comment-list{max-height:200px;overflow-y:auto;margin-bottom:10px;}
.comment-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
.comment-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.comment-uid{font-size:12px;color:var(--accent);font-weight:700;}
.comment-time{font-size:11px;color:var(--text3);font-family:var(--fm);}
.comment-del{margin-left:auto;background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:11px;padding:0;}
.comment-del:hover{color:var(--red);}
.comment-text{font-size:13px;color:var(--text);line-height:1.5;}
.comment-form{display:flex;gap:8px;}
.comment-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:var(--fb);font-size:13px;outline:none;resize:none;}
.comment-input:focus{border-color:var(--accent);}
.comment-submit{padding:8px 16px;background:var(--accent);border:none;border-radius:8px;color:#000;font-family:var(--fd);font-size:13px;cursor:pointer;white-space:nowrap;}
.comment-submit:hover{background:#33ddff;}
.no-comments{color:var(--text3);font-size:12px;text-align:center;padding:16px;}

/* 포트폴리오 */
.portfolio-layout{background:var(--surface2);border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:0 12px 12px 12px;padding:24px;}
.pf-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px;}
.pf-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;}
.pf-card-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.pf-card-value{font-family:var(--fm);font-size:22px;font-weight:700;}
.section-title{font-family:var(--fd);font-size:18px;color:var(--text2);margin-bottom:12px;letter-spacing:1px;}
.holdings-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:32px;}
.holdings-table th{padding:8px 12px;text-align:left;font-size:11px;color:var(--text3);text-transform:uppercase;border-bottom:1px solid var(--border);font-weight:400;}
.holdings-table td{padding:8px 12px;border-bottom:1px solid rgba(30,58,95,.5);font-family:var(--fm);vertical-align:middle;}
.holdings-table tr:hover td{background:rgba(0,212,255,.04);}
.sell-inline{display:flex;align-items:center;gap:6px;}
.sell-qty-input{width:52px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 6px;color:var(--text);font-family:var(--fm);font-size:13px;text-align:center;outline:none;}
.sell-qty-input:focus{border-color:var(--red);}
.sell-btn-inline{padding:4px 10px;background:var(--red);border:none;border-radius:6px;color:#fff;font-family:var(--fd);font-size:13px;cursor:pointer;}
.sell-btn-inline:hover{background:#ff6070;}
.history-list{max-height:300px;overflow-y:auto;}
.history-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;margin-bottom:4px;font-size:12px;background:var(--surface);border:1px solid var(--border);}
.history-time{color:var(--text3);font-family:var(--fm);min-width:140px;}
.history-action{font-weight:700;font-family:var(--fd);font-size:14px;min-width:30px;letter-spacing:1px;}
.history-stock{flex:1;color:var(--text2);}
.history-amt{font-family:var(--fm);}
.reset-btn{margin-top:24px;padding:10px 20px;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:8px;cursor:pointer;font-family:var(--fb);font-size:13px;transition:all .15s;}
.reset-btn:hover{background:var(--red);color:#fff;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;backdrop-filter:blur(2px);}
.overlay.open{display:block;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 24px;font-size:14px;z-index:999;transition:transform .3s;max-width:400px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{border-color:var(--green);color:var(--green);}
.toast.error{border-color:var(--red);color:var(--red);}
.toast.info{border-color:var(--accent);color:var(--accent);}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-state-icon{font-size:48px;margin-bottom:16px;}
.gold{color:var(--gold);}
</style>
</head>
<body>

<!-- 로그인/회원가입 모달 -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeAuthModal()">×</button>
    <div class="modal-logo">KBO<span>stock</span></div>
    <div class="modal-sub">KBO 선수 기록 기반 모의주식</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login',this)">로그인</button>
      <button class="auth-tab" onclick="switchAuthTab('register',this)">회원가입</button>
    </div>
    <div id="auth-login">
      <input class="auth-input" id="login-id" placeholder="아이디" onkeydown="if(event.key==='Enter')doLogin()">
      <input class="auth-input" id="login-pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="auth-btn" onclick="doLogin()">로그인</button>
    </div>
    <div id="auth-register" style="display:none">
      <input class="auth-input" id="reg-id" placeholder="아이디 (2자 이상)" onkeydown="if(event.key==='Enter')doRegister()">
      <input class="auth-input" id="reg-pw" type="password" placeholder="비밀번호 (4자 이상)" onkeydown="if(event.key==='Enter')doRegister()">
      <button class="auth-btn" onclick="doRegister()">회원가입</button>
    </div>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="logo">KBO<span>stock</span></div>
    <div class="header-stats">
      <div class="hstat"><span class="hstat-label">평가자산</span><span class="hstat-value gold" id="h-total">—</span></div>
      <div class="hstat"><span class="hstat-label">현금잔고</span><span class="hstat-value" id="h-cash">—</span></div>
      <div class="hstat"><span class="hstat-label">총 손익</span><span class="hstat-value" id="h-profit">—</span></div>
      <div class="hstat"><span class="hstat-label">수익률</span><span class="hstat-value" id="h-rate">—</span></div>
    </div>
    <div class="header-right">
      <div class="updated-badge" id="updated-badge">—</div>
      <!-- 비로그인 -->
      <div id="header-guest">
        <button class="header-btn btn-login" onclick="openAuthModal('login')">로그인</button>
        <button class="header-btn btn-register" onclick="openAuthModal('register')">회원가입</button>
      </div>
      <!-- 로그인 후 -->
      <div id="header-user" style="display:none;align-items:center;gap:8px;">
        <div class="user-badge" onclick="openNicknameModal()" title="닉네임 변경" style="cursor:pointer;">👤 <strong id="header-username"></strong> <span style="font-size:10px;opacity:.6">✏️</span></div>
        <button class="header-btn btn-logout" onclick="doLogout()">로그아웃</button>
      </div>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('market',this)">📈 시장</button>
  <button class="tab-btn" onclick="switchTab('portfolio',this)">💼 포트폴리오</button>
</div>

<div class="main-wrap">
  <div id="tab-market" class="tab-panel active">
    <div id="movers-banner" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:16px;">
      <div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:10px;padding:14px;">
        <div style="font-size:11px;color:var(--green);font-weight:700;letter-spacing:1px;margin-bottom:10px;">🚀 급등주 · 타자</div>
        <div id="movers-up-batter"></div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid #00e6a0;border-radius:10px;padding:14px;">
        <div style="font-size:11px;color:#00e6a0;font-weight:700;letter-spacing:1px;margin-bottom:10px;">🚀 급등주 · 투수</div>

// Firebase Auth는 이메일 형식 필요 → uid@kbo.local 형태로 변환
const toEmail = uid => `${uid}@kbo.local`;
const fromEmail = email => email.replace('@kbo.local','');

async function doLogin(){
  const uid=document.getElementById('login-id').value.trim();
  const pw=document.getElementById('login-pw').value.trim();
  if(!uid||!pw){document.getElementById('auth-err').textContent='아이디와 비밀번호를 입력하세요';return;}
  try{
    const cred = await signInWithEmailAndPassword(auth, toEmail(uid), pw);
    showToast(`${uid}님 환영합니다!`,'success');
  }catch(e){
    const msg = e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'
      ? '아이디 또는 비밀번호가 틀렸습니다' : '로그인 오류: '+e.message;
    document.getElementById('auth-err').textContent=msg;
  }
}

async function doRegister(){
  const uid=document.getElementById('reg-id').value.trim();
  const pw=document.getElementById('reg-pw').value.trim();
  if(!uid||!pw){document.getElementById('auth-err').textContent='아이디와 비밀번호를 입력하세요';return;}
  if(uid.length<2){document.getElementById('auth-err').textContent='아이디는 2자 이상이어야 합니다';return;}
  if(pw.length<6){document.getElementById('auth-err').textContent='비밀번호는 6자 이상이어야 합니다';return;}
  try{
    const cred = await createUserWithEmailAndPassword(auth, toEmail(uid), pw);
    // Firestore에 포트폴리오 초기화
    await setDoc(doc(db,'users',cred.user.uid),{
      username: uid,
      cash: INITIAL_CASH,
      holdings: {},
      history: [],
      created_at: serverTimestamp()
    });
    showToast('회원가입 완료! 1,000만원이 지급되었습니다.','success');
  }catch(e){
    const msg = e.code==='auth/email-already-in-use' ? '이미 사용중인 아이디입니다'
      : e.code==='auth/weak-password' ? '비밀번호는 6자 이상이어야 합니다'
      : '오류: '+e.message;
    document.getElementById('auth-err').textContent=msg;
  }
}

// ── 모버스 (인라인 데이터 기반) ──────────────────────
function loadMovers(){
  const hist = HISTORY_DATA;
  const movers = PLAYERS_DATA.stocks.map(s=>{
    const entries = hist[s.id]||[];
    if(entries.length<2) return null;
    const cur=entries[entries.length-1].close;
    const prev=entries[entries.length-2].close;
    if(!prev) return null;
    return {id:s.id,playerName:s.playerName,team:s.team,stat:s.stat,
            position:s.position,currentPrice:cur,isETF:s.isETF||false,
            changeRate:Math.round((cur-prev)/prev*10000)/100};
  }).filter(Boolean);

  const render=(list,elId,isUp)=>{
    const el=document.getElementById(elId);
    if(!el) return;
    if(!list.length){el.innerHTML='<div style="color:var(--text3);font-size:12px">데이터 없음</div>';return;}
    el.innerHTML=list.map((m,i)=>{
      const col=isUp?'var(--green)':'var(--red)';
      const sign=m.changeRate>=0?'+':'';
      const badge=m.isETF?'<span style="font-size:9px;background:#ffd70022;color:#ffd700;border:1px solid #ffd700;border-radius:3px;padding:1px 4px;margin-left:4px">ETF</span>':'';
      return `<div onclick="window._selectStockById('${m.id}')" style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;border-radius:6px;transition:background .15s;${i<list.length-1?'border-bottom:1px solid var(--border)':''}" onmouseover="this.style.background='rgba(0,212,255,0.05)'" onmouseout="this.style.background='transparent'">
        <span style="font-size:13px;font-weight:700;color:var(--text3);min-width:16px">${i+1}</span>
        <div style="flex:1"><div style="font-size:13px;font-weight:500">${m.playerName}${badge}</div>
        <div style="font-size:11px;color:var(--text3)">${m.team} · ${m.stat}</div></div>
        <div style="text-align:right">
          <div style="font-family:var(--fm);font-size:13px;font-weight:700;color:${col}">${sign}${m.changeRate}%</div>
          <div style="font-family:var(--fm);font-size:11px;color:var(--text3)">${fmtShort(m.currentPrice)}원</div>
        </div></div>`;
    }).join('');
  };

  const batters=movers.filter(m=>m.position==='타자').sort((a,b)=>b.changeRate-a.changeRate);
  const pitchers=movers.filter(m=>m.position==='투수').sort((a,b)=>b.changeRate-a.changeRate);
  render(batters.slice(0,3),'movers-up-batter',true);
  render(pitchers.slice(0,3),'movers-up-pitcher',true);
  render([...batters].reverse().slice(0,3),'movers-down-batter',false);
  render([...pitchers].reverse().slice(0,3),'movers-down-pitcher',false);
}

async function getUserDoc(){
  if(!currentUser) return null;
  const ref=doc(db,'users',currentUser.uid);
  const snap=await getDoc(ref);
  if(!snap.exists()){
    // 구글/기존 로그인 유저 초기화
    const data={username:fromEmail(currentUser.email),cash:INITIAL_CASH,holdings:{},history:[],created_at:serverTimestamp()};
    await setDoc(ref,data); return data;
  }
  return snap.data();
}

async function loadPortfolioHeader(){
  if(!currentUser) return;
  const pf=await getUserDoc(); if(!pf) return;
  const totalEval=calcTotalEval(pf);
  updateHeader({cash:pf.cash,totalEval,totalProfit:totalEval-INITIAL_CASH,
    totalProfitRate:Math.round((totalEval-INITIAL_CASH)/INITIAL_CASH*10000)/100});
}

async function loadPortfolio(){
  if(!currentUser){
    document.getElementById('pf-holdings').innerHTML=`<div class="empty-state"><div class="empty-state-icon">🔒</div><div>로그인 후 이용하세요</div></div>`;
    return;
  }
  const pf=await getUserDoc(); if(!pf) return;
  const totalEval=calcTotalEval(pf);
  // holdings → 배열로 변환
  const holdingsArr=Object.entries(pf.holdings||{}).map(([stockId,h])=>{
    const s=allStocks.find(x=>x.id===stockId);
    const price=s?s.currentPrice:h.avg_price;
    const evalVal=price*h.qty;
    const profit=evalVal-h.avg_price*h.qty;
    const hist=HISTORY_DATA[stockId]||[];
    const yest=hist.length>=2?hist[hist.length-2].close:null;
    return {stockId,qty:h.qty,avgPrice:h.avg_price,currentPrice:price,
            evalValue:evalVal,profit,profitRate:Math.round(profit/(h.avg_price*h.qty)*10000)/100,
            dayChange:yest?Math.round((price-yest)/yest*10000)/100:0};
  }).filter(h=>h.qty>0);
  const pfObj={cash:pf.cash,totalEval,totalProfit:totalEval-INITIAL_CASH,
    totalProfitRate:Math.round((totalEval-INITIAL_CASH)/INITIAL_CASH*10000)/100,
    holdings:holdingsArr,history:pf.history||[]};
  renderPortfolio(pfObj); updateHeader(pfObj);
}

function calcTotalEval(pf){
  let total=pf.cash||INITIAL_CASH;
  Object.entries(pf.holdings||{}).forEach(([stockId,h])=>{
    const s=allStocks.find(x=>x.id===stockId);
    if(s&&h.qty>0) total+=s.currentPrice*h.qty;
  });
  return total;
}

function updateHeader(pf){
  document.getElementById('h-total').textContent=fmt(pf.totalEval)+'원';
  document.getElementById('h-cash').textContent=fmt(pf.cash)+'원';
  const pe=document.getElementById('h-profit');
  pe.textContent=(pf.totalProfit>=0?'+':'')+fmt(pf.totalProfit)+'원';
  pe.className='hstat-value '+(pf.totalProfit>0?'pos':pf.totalProfit<0?'neg':'');
  const re=document.getElementById('h-rate');
  re.textContent=(pf.totalProfitRate>=0?'+':'')+pf.totalProfitRate+'%';
  re.className='hstat-value '+(pf.totalProfitRate>0?'pos':pf.totalProfitRate<0?'neg':'');
}

// ── 거래 (Firestore) ──────────────────────────────────
async function trade(action){
  if(!selectedStock||!currentUser) return;
  const qty=parseInt(document.getElementById('qty-input').value||1);
  const price=selectedStock.currentPrice;
  const total=price*qty;
  const ref=doc(db,'users',currentUser.uid);
  const pf=await getUserDoc(); if(!pf) return;
  const holdings={...pf.holdings||{}};
  let cash=pf.cash;

  if(action==='buy'){
    if(cash<total){showToast(`잔고 부족 (${fmt(total)}원 필요, ${fmt(cash)}원 보유)`,'error');return;}
    cash-=total;
    const h=holdings[selectedStock.id]||{qty:0,avg_price:0};
    const nq=h.qty+qty;
    holdings[selectedStock.id]={qty:nq, avg_price:Math.round((h.avg_price*h.qty+price*qty)/nq)};
  } else {
    const h=holdings[selectedStock.id];
    if(!h||h.qty<qty){showToast('보유 수량 부족','error');return;}
    cash+=total;
    holdings[selectedStock.id]={...h, qty:h.qty-qty};
    if(holdings[selectedStock.id].qty===0) delete holdings[selectedStock.id];
  }

  const now=new Date().toLocaleString('sv').replace('T',' ').slice(0,16);
  const histEntry={time:now,stockId:selectedStock.id,action,qty,price,total};
  const history=[...(pf.history||[]),histEntry].slice(-100);

  await updateDoc(ref,{cash,holdings,history});
  showToast(`${action==='buy'?'매수':'매도'} 완료: ${selectedStock.id} ${qty}주 @ ${fmt(price)}원`,'success');
  loadPortfolioHeader();
}

async function sellInline(safeId, stockId){
  const inp=document.getElementById(`sell-qty-${safeId}`);
  if(!inp) return;
  const qty=parseInt(inp.value||1);
  const s=allStocks.find(x=>x.id===stockId);
  if(!s){showToast('종목 없음','error');return;}
  const price=s.currentPrice, total=price*qty;
  const ref=doc(db,'users',currentUser.uid);
  const pf=await getUserDoc(); if(!pf) return;
  const holdings={...pf.holdings||{}};
  const h=holdings[stockId];
  if(!h||h.qty<qty){showToast('보유 수량 부족','error');return;}
  let cash=pf.cash+total;
  holdings[stockId]={...h,qty:h.qty-qty};
  if(holdings[stockId].qty===0) delete holdings[stockId];
  const now=new Date().toLocaleString('sv').replace('T',' ').slice(0,16);
  const history=[...(pf.history||[]),{time:now,stockId,action:'sell',qty,price,total}].slice(-100);
  await updateDoc(ref,{cash,holdings,history});
  showToast(`매도 완료: ${stockId} ${qty}주`,'success');
  loadPortfolio(); loadPortfolioHeader();
}

          <button class="period-btn" onclick="loadChart('${s.id}',9999,this)">전체</button>
        </div>
      </div>
      <div class="chart-canvas-wrap"><canvas id="price-chart"></canvas></div>
    </div>
    <div class="detail-stats-grid">
      <div class="dstat-card"><div class="dstat-label">${s.stat==='ETF'?'팀 순위':STAT_LABELS[s.stat]||s.stat}</div><div class="dstat-value" style="color:${col};font-size:${s.stat==='ETF'?'28px':'18px'}">${sv}</div></div>
      <div class="dstat-card"><div class="dstat-label">어제 종가</div><div class="dstat-value" style="color:var(--text2);font-size:14px">${fmt(s.prevPrice)}원</div></div>
    </div>
    <div class="trade-panel"><div class="trade-title">${s.stat==='ETF'?'📦 ETF 구성':'💡 가격 산정'}</div>${descHtml}<div style="font-size:12px;color:var(--text3);font-family:var(--fm)">${formula}</div></div>
    ${tradeHtml}
    <div class="comment-section">
      <div class="comment-title">💬 종목 토론</div>
      <div class="comment-list" id="comment-list"></div>
      ${currentUser?`
      <div class="comment-form">
        <textarea class="comment-input" id="comment-input" rows="2" placeholder="의견을 남겨주세요 (200자 이내)"></textarea>
        <button class="comment-submit" onclick="postComment('${s.id}')">등록</button>
      </div>`:`<div class="no-comments" style="cursor:pointer" onclick="openAuthModal('login')">🔒 로그인하면 댓글을 달 수 있어요</div>`}
    </div>`;
}

// ── 차트 ──────────────────────────────────────────────
function loadChart(stockId,days,btn){
  currentPeriod=days;
  if(btn){document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
  const entries=(HISTORY_DATA[stockId]||[]).slice(-days);
  renderChart(entries,stockId);
}

function renderChart(history,stockId){
  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  const oldTip=document.getElementById('chart-custom-tooltip');
  if(oldTip) oldTip.remove();
  const canvas=document.getElementById('price-chart');
  if(!canvas||!history.length) return;
  const col=STAT_COLORS[stockId.split('-').slice(-1)[0]]||'#00d4ff';
  const labels=history.map(h=>{const d=new Date(h.date);return `${d.getMonth()+1}/${d.getDate()}`;});
  const closes=history.map(h=>h.close);
  const grad=canvas.getContext('2d').createLinearGradient(0,0,0,160);
  grad.addColorStop(0,col+'44');grad.addColorStop(1,col+'00');
  const wrap=canvas.parentElement;
  const tip=document.createElement('div');
  tip.id='chart-custom-tooltip';
  tip.style.cssText='position:absolute;pointer-events:none;display:none;background:rgba(26,34,53,0.92);backdrop-filter:blur(6px);border:1px solid rgba(30,58,95,0.8);border-radius:8px;padding:8px 12px;font-family:JetBrains Mono,monospace;font-size:11px;line-height:1.8;z-index:99;white-space:nowrap;';
  wrap.style.position='relative'; wrap.appendChild(tip);
  const externalTooltip=(context)=>{
    const {chart,tooltip}=context;
    if(tooltip.opacity===0){tip.style.display='none';return;}
    const idx=tooltip.dataPoints[0].dataIndex;
    const h=history[idx];
    const chg=h.close-h.open, rate=h.open>0?((chg/h.open)*100).toFixed(2):'0.00';
    const sign=chg>=0?'+':'';
    const rateColor=chg>=0?'#00e676':'#ff3d57';
    const statVal=h.statValue!=null?(h.statLabel==='타율'||h.statLabel==='OPS'?'.'+String(Math.round(h.statValue*1000)).padStart(3,'0'):h.statValue.toFixed(2)):'';
    const statRow=statVal?`<div style="color:#7a9cc0">${h.statLabel}: <span style="color:#e8f0fe">${statVal}</span></div>`:'';
    tip.innerHTML=`<div style="color:#7a9cc0;margin-bottom:2px">${tooltip.title[0]}</div>
      <div style="color:#e8f0fe">종가: ${h.close.toLocaleString('ko-KR')}원</div>
      ${statRow}
      <div style="color:${rateColor}">등락률: ${sign}${rate}% (${sign}${chg.toLocaleString('ko-KR')}원)</div>`;
    const {offsetLeft,offsetTop}=chart.canvas;
    let left=offsetLeft+tooltip.caretX+10;
    if(left+140>wrap.offsetWidth) left=offsetLeft+tooltip.caretX-150;
    tip.style.left=left+'px'; tip.style.top=(offsetTop+tooltip.caretY-40)+'px'; tip.style.display='block';
  };
  chartInstance=new Chart(canvas,{
    type:'line',
    data:{labels,datasets:[{data:closes,borderColor:col,borderWidth:2,backgroundColor:grad,fill:true,tension:0.3,pointRadius:history.length>30?0:3,pointHoverRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{enabled:false,external:externalTooltip}},
      scales:{
        x:{grid:{color:'rgba(30,58,95,.4)'},ticks:{color:'#3d5a7a',font:{family:'JetBrains Mono',size:10},maxTicksLimit:8}},
        y:{grid:{color:'rgba(30,58,95,.4)'},ticks:{color:'#7a9cc0',font:{family:'JetBrains Mono',size:10},callback:v=>fmtShort(v)}}
      }
    }
  });
}

function closeDetail(){
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.querySelectorAll('.stock-row').forEach(r=>r.classList.remove('selected'));
  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  selectedStock=null;
}
function adjustQty(d){const inp=document.getElementById('qty-input');if(inp){inp.value=Math.max(1,parseInt(inp.value||1)+d);updateTradeSummary();}}
function updateTradeSummary(){if(!selectedStock)return;const el=document.getElementById('trade-total');if(el)el.textContent=fmt(selectedStock.currentPrice*parseInt(document.getElementById('qty-input').value||1));}

// ── 포트폴리오 렌더 ───────────────────────────────────
function renderPortfolio(pf){
  document.getElementById('pf-total').textContent=fmt(pf.totalEval)+'원';
  document.getElementById('pf-cash').textContent=fmt(pf.cash)+'원';
  const pe=document.getElementById('pf-profit');
  pe.textContent=(pf.totalProfit>=0?'+':'')+fmt(pf.totalProfit)+'원';
  pe.className='pf-card-value '+(pf.totalProfit>0?'pos':pf.totalProfit<0?'neg':'');
  const re=document.getElementById('pf-rate');
  re.textContent=(pf.totalProfitRate>=0?'+':'')+pf.totalProfitRate+'%';
  re.className='pf-card-value '+(pf.totalProfitRate>0?'pos':pf.totalProfitRate<0?'neg':'');
  const hw=document.getElementById('pf-holdings');
  if(!pf.holdings||!pf.holdings.length){
    hw.innerHTML=`<div class="empty-state"><div class="empty-state-icon">📊</div><div>보유 종목이 없습니다</div></div>`;
  }else{
    hw.innerHTML=`<table class="holdings-table">
      <thead><tr><th>종목</th><th style="text-align:right">보유</th><th style="text-align:right">평균단가</th><th style="text-align:right">현재가</th><th style="text-align:right">평가액</th><th style="text-align:right">손익</th><th style="text-align:right">당일</th><th style="text-align:right">매도</th></tr></thead>
      <tbody>${pf.holdings.map(h=>{
        const safeId=h.stockId.replace(/[^a-zA-Z0-9가-힣]/g,'_');
        return `<tr>
          <td>${h.stockId}</td><td style="text-align:right">${h.qty}주</td>
          <td style="text-align:right">${fmt(h.avgPrice)}</td><td style="text-align:right">${fmt(h.currentPrice)}</td>
          <td style="text-align:right">${fmt(h.evalValue)}</td>
          <td style="text-align:right" class="${h.profit>0?'pos':h.profit<0?'neg':'zero'}">${h.profit>=0?'+':''}${fmt(h.profit)}<br><span style="font-size:10px">(${h.profitRate>=0?'+':''}${h.profitRate}%)</span></td>
          <td style="text-align:right" class="${h.dayChange>0?'pos':h.dayChange<0?'neg':'zero'}">${h.dayChange>=0?'+':''}${h.dayChange}%</td>
          <td><div class="sell-inline">
            <input type="number" class="sell-qty-input" id="sell-qty-${safeId}" value="1" min="1" max="${h.qty}">
            <button class="sell-btn-inline" onclick="sellInline('${safeId}','${h.stockId.replace(/'/g,"\'")}')">매도</button>
          </div></td>
        </tr>`;
      }).join('')}</tbody></table>`;
  }
  const hiw=document.getElementById('pf-history');
  if(!pf.history||!pf.history.length){
    hiw.innerHTML=`<div style="color:var(--text3);font-size:13px;padding:12px">거래 내역이 없습니다.</div>`;
  }else{
    hiw.innerHTML=[...pf.history].reverse().map(h=>`
      <div class="history-row">
        <span class="history-time">${h.time}</span>
        <span class="history-action ${h.action==='buy'?'pos':'neg'}">${h.action==='buy'?'매수':'매도'}</span>
        <span class="history-stock">${h.stockId} ${h.qty}주</span>
        <span class="history-amt">${fmt(h.total)}원</span>
      </div>`).join('');
  }
}

// ── 필터 ──────────────────────────────────────────────
function setFilter(type,val,btn){
  filters[type]=val;
  const parent=btn.closest('.filter-chips')||btn.closest('.filter-section');
  parent.querySelectorAll('.chip,.stat-filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderStocks();
}

// ── 유틸 ──────────────────────────────────────────────
function fmt(n){return n==null?'—':Math.round(n).toLocaleString('ko-KR');}
function fmtShort(n){return n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?Math.round(n/1000)+'K':fmt(n);}
let toastTimer;
function showToast(msg,type='info'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast ${type} show`;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),3500);
}


// ── 닉네임 변경 ───────────────────────────────────────
function openNicknameModal(){
  if(!currentUser){showToast('로그인이 필요합니다','error');return;}
  document.getElementById('nickname-modal').classList.add('open');
  document.getElementById('nickname-err').textContent='';
  document.getElementById('new-nickname-input').value='';
  // 현재 닉네임 표시
  const me = fromEmail(currentUser.email);
  getUserDoc().then(pf=>{
    const nick = pf?.nickname || me;
    document.getElementById('current-nickname-display').textContent = nick;
  });
}
function closeNicknameModal(){
  document.getElementById('nickname-modal').classList.remove('open');
}
document.getElementById('nickname-modal').addEventListener('click',function(e){if(e.target===this)closeNicknameModal();});

async function doChangeNickname(){
  const inp = document.getElementById('new-nickname-input');
  const nick = inp.value.trim();
  const errEl = document.getElementById('nickname-err');
  if(!nick){errEl.textContent='닉네임을 입력하세요';return;}
  if(nick.length<2){errEl.textContent='2자 이상 입력하세요';return;}
  if(nick.length>10){errEl.textContent='10자 이내로 입력하세요';return;}
  try{
    await updateDoc(doc(db,'users',currentUser.uid),{nickname:nick});
    // 헤더 업데이트
    document.getElementById('header-username').textContent=nick;
    closeNicknameModal();
    showToast(`닉네임이 "${nick}"으로 변경됐습니다`,'success');
  }catch(e){errEl.textContent='변경 실패: '+e.message;}
}
