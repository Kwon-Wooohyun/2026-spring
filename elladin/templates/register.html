{% extends "base.html" %}
{% block title %}회원가입 — ELLADIN{% endblock %}
{% block content %}
<section class="auth-section">
  <h1>회원가입</h1>
  {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
  <form class="auth-form" action="{{ url_for('main.register') }}" method="POST">
    <div class="form-group">
      <label>아이디</label>
      <input type="text" name="username" required>
    </div>
    <div class="form-group">
      <label>닉네임</label>
      <input type="text" name="nickname" required>
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn-submit">가입하기</button>
  </form>
  <p class="auth-link">이미 계정이 있으신가요? <a href="{{ url_for('main.login') }}">로그인</a></p>
</section>
{% endblock %}
