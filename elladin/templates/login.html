{% extends "base.html" %}
{% block title %}로그인 — ELLADIN{% endblock %}
{% block content %}
<section class="auth-section">
  <h1>로그인</h1>
  {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
  <form class="auth-form" action="{{ url_for('main.login') }}" method="POST">
    <div class="form-group">
      <label>아이디</label>
      <input type="text" name="username" required>
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn-submit">로그인</button>
  </form>
  <p class="auth-link">계정이 없으신가요? <a href="{{ url_for('main.register') }}">회원가입</a></p>
</section>
{% endblock %}
